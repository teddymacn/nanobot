x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ~/.nanobot/config.json:/root/.nanobot/config.json:ro
    - ./roles/coder:/root/.nanobot/workspace
    - ./skills:/root/.nanobot/workspace/skills
    - /root/.nanobot/workspace/memory # anonymous volume for fresh memory each time
    - ./roles/coder/memory/HISTORY.md:/root/.nanobot/workspace/memory/HISTORY.md # expose history
    - ./roles/beads-template/HEARTBEAT.md:/root/.nanobot/workspace/HEARTBEAT.md
    - .:/root/.nanobot/workspace/project
  env_file:
    - .env

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
